name: Python lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check .
